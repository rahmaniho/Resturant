<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="نرم‌افزار مدیریت صبحانه‌سرای آفتاب — فروش، انبار، مالی و گزارش‌ها" />
  <meta name="theme-color" content="#0f3d2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="آفتاب" />
  <title>صبحانه‌سرای آفتاب — نرم‌افزار مدیریت</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar-overlay"></div>

    <aside id="sidebar" aria-label="منوی اصلی">
      <div class="brand">
        <img class="brand-logo" src="./icons/icon-192.png" alt="آفتاب" />
        <div class="brand-text">
          <div class="brand-title">صبحانه‌سرای آفتاب</div>
          <div class="brand-sub">نرم‌افزار مدیریت</div>
        </div>
      </div>
      <nav class="nav" id="nav"><!-- توسط app.js ساخته می‌شود --></nav>
      <div class="sidebar-foot">نسخه ۱.۰ • ذخیره‌سازی محلی (IndexedDB)</div>
    </aside>

    <div id="main">
      <header id="topbar">
        <button class="btn btn-ghost btn-icon menu-toggle" id="menu-toggle" type="button" aria-label="منو">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="topbar-title" id="page-title">داشبورد</h1>
        <span class="topbar-date" id="topbar-date"></span>
        <div class="topbar-spacer"></div>
        <button class="btn btn-ghost btn-icon hidden" id="btn-install" type="button" aria-label="نصب برنامه" title="نصب برنامه روی این دستگاه (PWA)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"/><path d="m8 9 4 4 4-4"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>
        </button>
        <button class="btn btn-ghost btn-icon" id="theme-toggle" type="button" aria-label="تغییر حالت نمایش" title="تغییر حالت روشن/تاریک">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>
        </button>
      </header>

      <main id="page" tabindex="-1"><!-- توسط صفحات ساخته می‌شود --></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- کتابخانه‌های محلی (بدون وابستگی به اینترنت) -->
  <script src="./vendor/chart.umd.js"></script>
  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
