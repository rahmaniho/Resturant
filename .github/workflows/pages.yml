# انتشار استاتیک روی GitHub Pages — بدون هیچ سرور یا بک‌اند
# فایل‌ها مستقیم از همین مخزن (HTML/CSS/JS) منتشر می‌شوند.
name: Deploy to GitHub Pages

on:
  push:
    branches: [arena/0c347b5d-resturant]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Debug — twirp ListArtifacts
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          tok = os.environ['ACTIONS_RUNTIME_TOKEN']
          def b64url(s):
              s += '=' * (-len(s) % 4)
              return base64.urlsafe_b64decode(s)
          try:
              claims = json.loads(b64url(tok.split('.')[1]))
              print('claim keys:', sorted(claims.keys()))
          except Exception as e:
              print('token not a JWT or undecodable:', e)
              claims = {}
          body = json.dumps({
              'workflowRunBackendId': claims.get('workflow_run_backend_id', ''),
              'workflowJobRunBackendId': claims.get('workflow_job_run_backend_id', ''),
          }).encode()
          url = os.environ['ACTIONS_RESULTS_URL'].rstrip('/') + '/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts'
          req = urllib.request.Request(url, data=body, headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
          try:
              resp = urllib.request.urlopen(req, timeout=20)
              print('twirp status', resp.status)
              print('twirp body:', resp.read().decode()[:2000])
          except Exception as e:
              print('twirp error:', e)
              if hasattr(e, 'read'):
                  print('twirp err body:', e.read().decode()[:800])
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
